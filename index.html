const devId=()=>{let x=ls.g('dev','');if(!x){x=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));ls.s('dev',x)}return x};
const verNum=x=>String(x||'0').split('.').map(n=>parseInt(n)||0);
const newer=(a,b)=>{const x=verNum(a),y=verNum(b);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}return false};

/* ---------- gate: blocked / maintenance / forced update ---------- */
function openUpdate(){const u=RC.update&&RC.update.url;if(u)window.open(u,'_blank')}
window.openUpdate=openUpdate;
function gate(){
 const g=$('#gate'),up=RC.update||{},mt=RC.maintenance||{};let msg='',btn='';
 if(blocked)msg='⛔ This device has been blocked.\nDevice ID: '+devId();
 else if(mt.on)msg='🛠 '+(mt.msg||'We are doing maintenance. Please try again later.');
 else if(up.force&&up.latest&&newer(up.latest,APP_VERSION)){msg='⬆ '+(up.msg||'A new version is available. Please update to continue.')+'\nYour version: '+APP_VERSION+' · New version: '+up.latest;if(up.url)btn='<button class="btn" onclick="openUpdate()">Update now</button>'}
 if(msg){$('#gmsg').textContent=msg;$('#gbtn').innerHTML=btn;g.classList.remove('hide');if(!v.paused)v.pause();return true}
 g.classList.add('hide');
 if(booted&&!entered){entered=true;enter().finally(()=>{applyRC();initAds()})}
 return false}

let lastHb=0;
async function heartbeat(force){
 if(!window.FB||document.visibilityState!=='visible')return;
 if(!force&&Date.now()-lastHb<60e3)return;lastHb=Date.now();
 const d={lastSeen:FB.serverTimestamp(),version:APP_VERSION,ua:navigator.userAgent.slice(0,180),watching:cur&&cur.it?String(cur.it.name).slice(0,100):''};
 if(!ls.g('reg',false))d.firstSeen=FB.serverTimestamp();
 try{await FB.setDoc(FB.doc(FB.db,'devices',devId()),d,{merge:true});ls.s('reg',true)}catch(e){}
 try{const was=blocked;blocked=(await FB.getDoc(FB.doc(FB.db,'blocked',devId()))).exists();if(was!==blocked)gate()}catch(e){}
}
setInterval(()=>heartbeat(true),5*60e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')heartbeat(false)});

/* ---------- start: splash -> auto login -> app ---------- */
(async()=>{
 const t0=Date.now();
 await fbWait();
 if(window.FB){
  let first;const got=new Promise(r=>first=r);
  FB.onSnapshot(FB.doc(FB.db,'config','app'),sn=>{
   RC=sn.exists()?(sn.data()||{}):{};
   const sv=RC.server||{};if(!entered&&sv.host&&sv.user&&sv.pass){H=String(sv.host).trim().replace(/\/+$/,'');U=String(sv.user).trim();P=String(sv.pass).trim()}
   first();applyRC()},()=>first());
  await Promise.race([got,sleep(5000)]);
  await Promise.race([heartbeat(true),sleep(3000)]);
 }
 await sleep(Math.max(0,2000-(Date.now()-t0)));
 $('#splash').classList.add('hide');booted=true;gate();
})();

    api('get_vod_info','&vod_id='+it.id).then(d=>{if(cur&&cur.it==it){cur.det=d.info||{};renderInfo()}}).catch(()=>{})};

 }catch(e){if(cur&&cur.it==it&&!v.src)$('#msg').textContent='Could not load this title.'}
}
function playEp(e,t){cur.ep=e;$('#ct').textContent=$('#mt').textContent=`${cur.it.name} · S${e.s} E${e.n}`;play(srcUrl(cur.it,e),t);renderEps();nxUpdate()}
const nextEp=()=>cur?.ep?cur.eps[cur.eps.indexOf(cur.ep)+1]:null;
function nxUpdate(){$('#nx').classList.toggle('hide',!nextEp())}
function renderInfo(){
 const it=cur.it,d=cur.det,fav=ls.g('fav',[]).includes(it.t+':'+it.id);
 const rows=[['Release',d.releasedate||d.releaseDate],['Rating',d.rating],['Genre',d.genre],['Cast',d.cast||d.actors],['Director',d.director],['Duration',d.duration||d.episode_run_time]].filter(r=>r[1]&&r[1]!='0');
 $('#info').innerHTML=`<h2>${esc(it.name)}</h2><div class="mu">${it.t=='movie'?'Movie':'Series'}${d.releasedate||d.releaseDate?' · '+esc((d.releasedate||d.releaseDate).slice(0,4)):''}${d.genre?' · '+esc(d.genre):''}</div>
 <div class="acts"><button id="fav">${fav?'♥ Favorited':'♡ Favorite'}</button><button id="dl">⬇ Download</button></div>
 <div class="dsc clamp" id="dsc"><div class="pl">${esc(d.plot||d.description||'No description available.')}</div><div class="ex">${rows.map(r=>esc(r[0])+': '+esc(r[1])).join('\n')}</div></div>
 <button id="more">...more</button>${it.t=='series'?'<div id="eps"></div>':''}`;
 $('#hb').textContent=fav?'♥':'♡';renderEps()}
function renderEps(){
 const el=$('#eps');if(!el||!cur.eps.length)return;
 const seasons=[...new Set(cur.eps.map(e=>e.s))];
 el.innerHTML=`<select id="ssel">${seasons.map(s=>`<option value="${s}" ${s==cur.season?'selected':''}>Season ${s}</option>`).join('')}</select>`+cur.eps.filter(e=>e.s==cur.season).map(e=>`<button class="ep ${e==cur.ep?'on':''}" data-ep="${cur.eps.indexOf(e)}">${e.n}. ${esc(e.t)}</button>`).join('')}
function renderRecs(){
 const it=cur.it,L=st.all.filter(i=>i.t==it.t&&i.cat==it.cat&&i!=it);L.sort(()=>Math.random()-.5);
 $('#recs').innerHTML='<h3 style="margin:0 0 10px">Recommended</h3>'+L.slice(0,20).map(i=>`<div class="rc card" tabindex="0" data-k="${i.t}:${i.id}"><div class="ph">${i.img?`<img loading="lazy" src="${esc(i.img)}" onerror="this.remove()">`:''}</div><div><div class="nm">${esc(i.name)}</div><div class="mu">${i.t=='movie'?'Movie':'Series'}${i.rt&&i.rt!='0'?' · ★ '+esc(i.rt):''}</div></div></div>`).join('')}
$('#info').addEventListener('click',e=>{
 const t=e.target;let x;
 if(t.id=='more'){const c=$('#dsc').classList.toggle('clamp');t.textContent=c?'...more':'Show less'}
 else if(t.id=='fav')toggleFav();
 else if(t.id=='dl')download();
 else if(x=t.closest('[data-ep]'))playEp(cur.eps[x.dataset.ep],0);
});
$('#info').addEventListener('change',e=>{if(e.target.id=='ssel'){cur.season=+e.target.value;renderEps()}});
function toggleFav(){const k=cur.it.t+':'+cur.it.id;let f=ls.g('fav',[]);f=f.includes(k)?f.filter(x=>x!=k):[k,...f];ls.s('fav',f);renderInfo()}
$('#hb').onclick=toggleFav;
function download(){
 if(cur.it.t=='series'&&!cur.ep)return;
 const url=srcUrl(cur.it,cur.ep),name=cur.it.name+(cur.ep?` – S${cur.ep.s}E${cur.ep.n}`:'');
 ls.s('dl',[{name,url},...ls.g('dl',[]).filter(d=>d.url!=url)]);
 const a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function saveRec(){
 if(!cur||!isFinite(v.duration)||v.currentTime<5)return;
 const k=cur.it.t+':'+cur.it.id;let r=ls.g('rec',[]).filter(x=>x.k!=k);
 r.unshift({k,ep:cur.ep?.id||null,t:v.ended?0:v.currentTime,d:v.duration,ts:Date.now()});ls.s('rec',r.slice(0,30))}

/* mini player + close */
const mini=()=>{pl.classList.add('mini');$('#gp').classList.add('hide');updExb()};
const expand=()=>{pl.classList.remove('mini');pl.scrollTop=0;ctlShow();updExb()};
function closePl(){saveRec();v.pause();if(hls){hls.destroy();hls=null}v.removeAttribute('src');v.load();pl.classList.add('hide');pl.classList.remove('mini');cur=null;updExb();if(document.fullscreenElement)document.exitFullscreen()}
$('#bk').onclick=e=>{e.stopPropagation();mini()};$('#mx').onclick=e=>{e.stopPropagation();closePl()};
$('#mpp').onclick=e=>{e.stopPropagation();v.paused?v.play():v.pause()};
$('#mt').onclick=expand;

/* drag down on the video to minimize (back button still works too) */
(function(){
 const w=$('#vwrap');let sx=0,sy=0,dy=0,on=false,act=false;
 w.addEventListener('touchstart',e=>{
  if(!full()||document.fullscreenElement||e.touches.length!=1||e.target.closest('#ctl button,#ctl input,#gp')){act=false;return}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;dy=0;on=false;act=true;pl.classList.remove('snap')},{passive:true});
 w.addEventListener('touchmove',e=>{
  if(!act)return;const t=e.touches[0],dx=t.clientX-sx;dy=t.clientY-sy;
  if(!on){if(dy>12&&dy>Math.abs(dx)*1.5)on=true;else if(Math.abs(dx)>12||dy<-12){act=false;return}else return}
  e.preventDefault();const p=Math.min(1,dy/400);
  pl.style.transform='translateY('+(dy*.6)+'px) scale('+(1-p*.15)+')';pl.style.opacity=1-p*.6},{passive:false});
 const end=()=>{
  if(!act)return;act=false;
  pl.classList.add('snap');pl.style.transform='';pl.style.opacity='';
  if(on&&dy>90)mini();
  on=false;setTimeout(()=>pl.classList.remove('snap'),250)};
 w.addEventListener('touchend',end);w.addEventListener('touchcancel',end);
})();

/* controls */
function ctlShow(){$('#ctl').classList.remove('off');clearTimeout(hideT);hideT=setTimeout(()=>{if(!v.paused)$('#ctl').classList.add('off')},3500)}
let lastTap=0,tapT=0,dtT=0,dtMode=false;
function flash(side){$(side=='l'?'#dtl':'#dtr').classList.add('on');clearTimeout(dtT);dtT=setTimeout(()=>{$('#dtl').classList.remove('on');$('#dtr').classList.remove('on')},500)}
$('#vwrap').addEventListener('click',e=>{
 if(pl.classList.contains('mini'))return expand();
 if(e.target.closest('#ctl button,#ctl input,#gp'))return ctlShow();
 const now=Date.now(),r=$('#vwrap').getBoundingClientRect(),x=e.clientX-r.left;
 if(now-lastTap<300||(dtMode&&now-lastTap<500)){
  clearTimeout(tapT);dtMode=true;lastTap=now;
  if(x<r.width*.4){skip(-10);flash('l')}else if(x>r.width*.6){skip(10);flash('r')}
  return}
 dtMode=false;lastTap=now;clearTimeout(tapT);
 tapT=setTimeout(()=>{const c=$('#ctl');if(c.classList.contains('off'))ctlShow();else if(!v.paused)c.classList.add('off')},300)});
const tog=()=>v.paused?v.play():v.pause(),skip=s=>{v.currentTime=Math.max(0,Math.min(v.duration||1e9,v.currentTime+s))};
$('#pp').onclick=tog;$('#b10').onclick=()=>skip(-10);$('#f10').onclick=()=>skip(10);
$('#nx').onclick=()=>{const n=nextEp();if(n)playEp(n,0)};
v.onplay=v.onpause=()=>{$('#pp').textContent=v.paused?'▶':'⏸';$('#mpp').textContent=v.paused?'▶':'⏸';if(v.paused){ctlShow();saveRec()}};
v.ontimeupdate=()=>{const d=v.duration||0;$('#seek').max=d||1;$('#seek').value=v.currentTime;$('#tm').textContent=fmt(v.currentTime)+' / '+fmt(d);if(Date.now()-lastSave>5000){lastSave=Date.now();saveRec()}};
v.onended=()=>{saveRec();const n=nextEp();if(n&&set.auto)playEp(n,0)};
$('#seek').oninput=e=>{v.currentTime=+e.target.value};
$('#vol').oninput=e=>{v.volume=+e.target.value;v.muted=v.volume==0};
$('#mute').onclick=()=>{v.muted=!v.muted};
v.onvolumechange=()=>{$('#mute').textContent=v.muted||!v.volume?'🔇':'🔊'};
$('#fs').onclick=()=>{const w=$('#vwrap');if(document.fullscreenElement)document.exitFullscreen();else if(w.requestFullscreen)w.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()};
const tt=()=>[...v.textTracks].filter(t=>t.kind=='subtitles'||t.kind=='captions');
function ccUpdate(){const T=tt();$('#cc').classList.toggle('hide',!T.length);if(T.length&&set.subs&&!T.some(t=>t.mode=='showing'))T[0].mode='showing'}
v.textTracks.onaddtrack=ccUpdate;
$('#cc').onclick=()=>{const T=tt(),on=T.some(t=>t.mode=='showing');T.forEach((t,i)=>t.mode=!on&&i==0?'showing':'hidden');$('#cc').style.opacity=on?.6:1};
$('#gear').onclick=()=>{
 const g=$('#gp');g.classList.toggle('hide');if(g.classList.contains('hide'))return;
 let h='<b>Speed</b><div>'+[.5,.75,1,1.25,1.5,2].map(s=>`<button data-sp="${s}" class="${v.playbackRate==s?'on':''}">${s}x</button>`).join('')+'</div>';
 {const T=tt(),on=T.some(t=>t.mode=='showing');
  h+='<b>Subtitles</b><div>'+(T.length?`<button data-sub="1" class="${on?'on':''}">On</button><button data-sub="0" class="${on?'':'on'}">Off</button>`:'<span class="mu" style="padding:4px 10px">Not available</span>')+'</div>'}
 if(hls&&hls.levels.length>1)h+='<b>Quality</b><div><button data-lv="-1">Auto</button>'+hls.levels.map((l,i)=>`<button data-lv="${i}">${l.height}p</button>`).join('')+'</div>';
 if(hls&&hls.audioTracks.length>1)h+='<b>Audio</b><div>'+hls.audioTracks.map((a,i)=>`<button data-au="${i}">${esc(a.name||a.lang||i+1)}</button>`).join('')+'</div>';
 g.innerHTML=h};
$('#gp').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.sp)v.playbackRate=+d.sp;if(d.sub!=null){const on=d.sub=='1';tt().forEach((t,k)=>t.mode=on&&k==0?'showing':'hidden');$('#cc').style.opacity=on?1:.6}if(d.lv!=null)hls.currentLevel=+d.lv;if(d.au!=null)hls.audioTrack=+d.au;$('#gp').classList.add('hide')};

/* keys: TV remote, keyboard, back */
function back(){
 if(!$('#set').classList.contains('hide'))return $('#set').classList.add('hide');
 if(full())return mini();
 if(st.view!='home'||st.q||st.cat!='all'){st.view='home';st.q=qi.value='';st.cat='all';render()}}
window.addEventListener('popstate',()=>{
 if(!trapped)return;
 let h=false;
 if(!$('#set').classList.contains('hide')){$('#set').classList.add('hide');h=true}
 else if(full()){mini();h=true}
 else if(st.view!='home'||st.q||st.cat!='all'){st.view='home';st.q=qi.value='';st.cat='all';render();h=true}
 if(h)history.pushState({s:1},'');else history.back()});
function spatial(dir){
 const root=!$('#set').classList.contains('hide')?$('#set'):full()?pl:document.body,a=document.activeElement;
 const els=[...root.querySelectorAll('[tabindex="0"],button,input,select,a[href]')].filter(e=>e.getClientRects().length&&!e.disabled);
 if(a==document.body||!root.contains(a)){els[0]?.focus();return}
 const r=a.getBoundingClientRect(),ax=r.left+r.width/2,ay=r.top+r.height/2;let best,bs=1e9;
 for(const e of els){if(e==a)continue;const q=e.getBoundingClientRect(),dx=q.left+q.width/2-ax,dy=q.top+q.height/2-ay;
  const ok=dir=='ArrowRight'?dx>5:dir=='ArrowLeft'?dx<-5:dir=='ArrowDown'?dy>5:dy<-5;if(!ok)continue;
  const h=dir=='ArrowRight'||dir=='ArrowLeft',s=h?Math.abs(dx)+Math.abs(dy)*3:Math.abs(dy)+Math.abs(dx)*3;if(s<bs){bs=s;best=e}}
 best?.focus()}
document.addEventListener('keydown',e=>{
 const k=e.key,a=document.activeElement,tag=a.tagName,typing=tag=='INPUT'&&a.type!='range'&&a.type!='checkbox';
 if(['Escape','GoBack','BrowserBack'].includes(k)||[4,10009,461].includes(e.keyCode)||(k=='Backspace'&&!typing)){e.preventDefault();return back()}
 if(!$('#gate').classList.contains('hide')||!$('#splash').classList.contains('hide')||!$('#brk').classList.contains('hide'))return;
 const arrow=k.startsWith('Arrow');
 if(full()&&$('#ctl').classList.contains('off')&&$('#set').classList.contains('hide')&&(arrow||k==' '||k=='Enter')){
  e.preventDefault();if(k==' '||k=='Enter')tog();else if(k=='ArrowLeft')skip(-10);else if(k=='ArrowRight')skip(10);else $('#seek').focus();
  return ctlShow()}
 if(a.id=='seek'&&(k=='ArrowLeft'||k=='ArrowRight')){e.preventDefault();skip(k=='ArrowLeft'?-10:10);return ctlShow()}
 if(full()&&!/BUTTON|INPUT|SELECT/.test(tag)){
  if(k==' '){e.preventDefault();tog()}else if(k=='f')$('#fs').click();else if(k=='m')v.muted=!v.muted}
 if(arrow){
  if(tag=='SELECT'||(tag=='INPUT'&&(k=='ArrowLeft'||k=='ArrowRight')&&a.type!='range'))return;
  if(a.type=='range'&&(k=='ArrowLeft'||k=='ArrowRight'))return;
  e.preventDefault();spatial(k);if(full())ctlShow()}
 else if(k=='Enter'&&a.getAttribute('tabindex')=='0'&&!/BUTTON|INPUT|SELECT/.test(tag)){a.click()}
});
</script></body></html>
